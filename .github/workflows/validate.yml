name: Validate XML

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Well-formedness
        run: |
          files=$(find inscriptions vocabularies bibliography -name '*.xml' 2>/dev/null)
          test -n "$files" || { echo "nessun file XML trovato"; exit 1; }
          xmllint --noout $files

      - name: Fetch the EpiDoc schema
        run: curl -sL -o tei-epidoc.rng http://epidoc.stoa.org/schema/latest/tei-epidoc.rng

      - name: Validate against EpiDoc
        run: xmllint --noout --relaxng tei-epidoc.rng inscriptions/*.xml
